<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat - Candra Naya Lestari</title>
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
  <style>
    body {
      /* Mengembalikan body ke kondisi normal */
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      color: white;
    }
    
    .page-wrapper {
      /* Memindahkan layout flexbox ke div pembungkus */
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
    }
    header .logo img { height: 70px; }
    header nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: 500; transition: 0.3s; }
    header nav a:hover { color: #00d8ff; }

    .chat-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      /* Menambahkan min-height untuk mencegah kontainer kolaps saat flexbox loading */
      min-height: 0;
    }
    .chat-box {
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .chat-box iframe {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        border-radius: 16px !important;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="images/logo-candranaya.png" alt="Logo" />
        </a>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="chatZoho.html" style="color:#00d8ff;">Zoho Chat</a>
      </nav>
    </header>

    <div class="chat-container">
      <div class="chat-box" id="chat-box">
      </div>
    </div>
  </div>

  <script>
    window.$zoho = window.$zoho || {};
    $zoho.salesiq = $zoho.salesiq || {
      widgetcode: "siq4ab1eaa13361987ab814a217f29bcd9b132b5f8128b28a8be65eb5c0e8308ac0",
      ready: function() {
        $zoho.salesiq.floatbutton.hide();
        $zoho.salesiq.chat.render("chat-box");
        $zoho.salesiq.chat.show();
      }
    };
  </script>
  <script id="zsiqscript" src="https://salesiq.zohopublic.com/widget"></script>

</body>
</html>
