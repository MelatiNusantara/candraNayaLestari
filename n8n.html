<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat - Candra Naya Lestari</title>
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      position: fixed;
      width: 100%;
      z-index: 10;
      box-sizing: border-box;
    }

    header .logo img {
      height: 70px;
    }

    header nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    header nav a:hover {
      color: #00d8ff;
    }

    .chat-container {
      margin-top: 110px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .chat-box {
      width: 100%;
      max-width: 900px;
      height: 75vh;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* Paksa iframe memenuhi kotak */
    #bp-embedded-webchat,
    #bp-embedded-webchat iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block !important;
    }

    /* Hilangkan tombol chat mengambang */
    .n8n-chat-floating-button {
      display: none !important;
    }

    /* Ubah background chat jadi merah */
    iframe {
      background: transparent !important;
    }

    /* Trik untuk inject CSS ke dalam iframe chat */
    #bp-embedded-webchat iframe {
      background-color: transparent !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="images/logo-candranaya.png" alt="Logo" />
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="chat.html" style="color:#00d8ff;">AI Chat</a>
    </nav>
  </header>

  <div class="chat-container">
    <div class="chat-box">
      <div id="bp-embedded-webchat"></div>
    </div>
  </div>

  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    const chat = createChat({
      webhookUrl: 'https://putrafirdaus.app.n8n.cloud/webhook/a889d2ae-2159-402f-b326-5f61e90f602e/chat',
      mode: 'fullscreen',
      target: '#bp-embedded-webchat',
      style: {
        width: '100%',
        height: '100%',
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        const floatBtn = document.querySelector('.n8n-chat-floating-button');
        if (floatBtn) floatBtn.remove();

        const iframe = document.querySelector('#bp-embedded-webchat iframe');
        if (iframe) {
          iframe.style.display = 'block';
          iframe.style.opacity = '1';
          iframe.style.width = '100%';
          iframe.style.height = '100%';

          // inject CSS merah ke dalam iframe
          iframe.addEventListener('load', () => {
            const style = document.createElement('style');
            style.textContent = `
              .chat-layout .chat-body {
                background: red !important;
              }
            `;
            iframe.contentDocument.head.appendChild(style);
          });
        }

        if (chat.openChat) {
          chat.openChat();
        } else {
          const bubble = document.querySelector('.n8n-chat-floating-button');
          if (bubble) bubble.click();
        }
      }, 1500);
    });
  </script>

</body>
</html>
