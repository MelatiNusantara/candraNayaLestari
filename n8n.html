<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat - Candra Naya Lestari</title>
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      position: fixed;
      width: 100%;
      z-index: 10;
    }

    header .logo img {
      height: 70px;
    }

    header nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    header nav a:hover {
      color: #00d8ff;
    }

    .chat-container {
      margin-top: 120px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-box {
      width: 90%;
      max-width: 800px;
      height: 75vh;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    #bp-embedded-webchat {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
    }

    .chat-input {
      display: flex;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 12px 20px;
      background: #00d8ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .chat-input button:hover {
      background: #00bcd4;
    }

    #bp-embedded-webchat iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 16px !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="images/logo-candranaya.png" alt="Logo" />
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="chat.html" style="color:#00d8ff;">AI Chat</a>
    </nav>
  </header>

  <div class="chat-container">
    <div class="chat-box">
      <div id="bp-embedded-webchat" style="width:100%; height:100%;"></div>
    </div>
  </div>

  <!-- SCRIPT BOTPRESS -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
      webhookUrl: 'https://putrafirdaus.app.n8n.cloud/webhook/a889d2ae-2159-402f-b326-5f61e90f602e/chat',
      mode: 'embedded', // 👈 Tambahkan ini!
      target: '#bp-embedded-webchat', // 👈 Sesuai dengan ID container kamu
      style: {
        width: '100%',
        height: '100%',
        border: 'none',
        background: 'transparent'
      }
    });
  </script>

  <!-- SCRIPT BOTPRESS -->
  <!-- <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2025/10/17/07/20251017074237-LB2TZ83I.js" defer></script> -->

  <script>
    // OPTIONAL: Kalau kamu ingin webchat muncul otomatis
    window.addEventListener('DOMContentLoaded', function() {
      // Pastikan script Botpress sudah siap
      window.botpressWebChat && window.botpressWebChat.sendEvent({
        type: 'show'
      });
    });
  </script>

</body>
</html>
