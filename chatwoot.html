<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatwoot Chat - Candra Naya Lestari</title>
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      position: fixed;
      width: 100%;
      z-index: 10;
    }

    header .logo img {
      height: 70px;
    }

    header nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    header nav a:hover {
      color: #00d8ff;
    }

    .chat-container {
      margin-top: 120px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-box {
      width: 90%;
      max-width: 800px;
      height: 75vh;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* Override Chatwoot widget position */
    #chatwoot_live_chat_widget {
      position: absolute !important;
      bottom: 0 !important;
      right: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 16px !important;
      box-shadow: none !important;
      transform: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="images/logo-candranaya.png" alt="Logo" />
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="chatwoot.html" style="color:#00d8ff;">Chatwoot Chat</a>
    </nav>
  </header>

  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- Chatwoot widget akan muncul di sini -->
    </div>
  </div>

    <!-- CHATWOOT SCRIPT -->
    <script>
      (function(d,t) {
        var BASE_URL = "https://app.chatwoot.com";
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
        g.src = BASE_URL + "/packs/js/sdk.js";
        g.async = true;
        s.parentNode.insertBefore(g, s);
        g.onload = function() {
          window.chatwootSDK.run({
            websiteToken: 'JcxnfWhh4JFVSgvCerp6WzZH',
            baseUrl: BASE_URL
          });

          // Tunggu widget muncul, lalu pindahkan ke dalam chat-box
          const interval = setInterval(() => {
            const widget = document.getElementById('chatwoot_live_chat_widget');
            const box = document.getElementById('chat-box');
            if (widget && box) {
              box.appendChild(widget);
              // Atur ukuran penuh ke dalam box
              widget.style.position = 'absolute';
              widget.style.bottom = '0';
              widget.style.right = '0';
              widget.style.width = '100%';
              widget.style.height = '100%';
              widget.style.borderRadius = '16px';
              widget.style.boxShadow = 'none';
              widget.style.transform = 'none';
              clearInterval(interval);
            }
          }, 500);
        };
      })(document, "script");
    </script>

</body>
</html>
