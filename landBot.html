<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat - Candra Naya Lestari</title>
  <link href="templatemo-3d-coverflow.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      position: fixed;
      width: 100%; /* Disesuaikan agar padding tidak menggeser layout */
      z-index: 10;
    }

    header .logo img {
      height: 70px;
    }

    header nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    header nav a:hover {
      color: #00d8ff;
    }

    .chat-container {
      margin-top: 120px; /* Memberi ruang di bawah header */
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .chat-box {
      width: 90%;
      max-width: 800px;
      height: 75vh;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="images/logo-candranaya.png" alt="Logo" />
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="chat.html" style="color:#00d8ff;">landBot Chat</a>
    </nav>
  </header>

  <div class="chat-container">
    <div class="chat-box">
      <div id="myLandbot" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <script SameSite="None; Secure" type="module" src="https://cdn.landbot.io/landbot-3/landbot-3.0.0.mjs"></script>
  <script type="module">
    var myLandbot = new Landbot.Container({
      container: '#myLandbot',
      configUrl: 'https://storage.googleapis.com/landbot.online/v3/H-3202800-SQBKFD2BSIPQTGMC/index.json',
    });
  </script>

</body>
</html>
